<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Acceso de Koddo: en un navegador marcado, el login lleva al Koe local en vez de la puerta falsa.
    // Marcar: /login?koe=local · Desmarcar: /login?koe=off. Solo afecta a este navegador.
    (function () {
      try {
        var p = new URLSearchParams(location.search).get('koe');
        if (p === 'local') localStorage.setItem('koddo_koe', 'local');
        if (p === 'off') localStorage.removeItem('koddo_koe');
        if (localStorage.getItem('koddo_koe') === 'local') location.replace('http://localhost:4321/');
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koddo · Platform</title>
  <meta name="description" content="Sign in to the Koddo platform, where you manage all your projects.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/webp" href="/images/web-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f2eb;
      --cream: #f1ede4;
      --ink: #121926;
      --ink-2: rgba(18, 25, 38, .62);
      --ink-3: rgba(18, 25, 38, .4);
      --line-c: rgba(18, 25, 38, .12);
      --red: #da3c33;
      --blur: blur(22px) saturate(140%);
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
           background-image: radial-gradient(rgba(18,25,38,.08) 1px, transparent 1.4px); background-size: 28px 28px; }
    a { color: inherit; text-decoration: none; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 18px clamp(16px, 4vw, 48px); }
    header img { height: 40px; width: auto; }
    .back { font: 500 11.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
    .back:hover { color: var(--ink); }
    main { flex: 1; display: grid; place-items: center; padding: 24px 16px 60px; }
    .card { width: min(420px, 100%); padding: 36px 32px 32px; border-radius: 24px; background: rgba(255,255,255,.5); border: 1px solid var(--line-c); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 30px 60px -36px rgba(18,25,38,.35); }
    .label { display: inline-flex; align-items: center; gap: 8px; font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
    .dot-red { width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px rgba(218,60,51,.6); }
    h1 { font: 400 40px/1.05 var(--serif); letter-spacing: -.015em; margin: 14px 0 6px; }
    h1 em { font-style: italic; }
    .sub { color: var(--ink-2); font-size: 15px; margin-bottom: 26px; }
    label.f { display: block; font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 8px; }
    input { width: 100%; height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-c); background: rgba(255,255,255,.75); font: 400 15px/1 var(--sans); color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; }
    input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(18,25,38,.08); }
    .row { display: flex; justify-content: flex-end; margin-top: 10px; }
    .row a { font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--ink-3); }
    button { width: 100%; height: 50px; margin-top: 24px; border: 0; border-radius: 999px; background: var(--ink); color: var(--cream); cursor: pointer; font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; transition: transform .2s; }
    button:hover { transform: translateY(-1px); }
    .msg { display: none; margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: rgba(218,60,51,.07); border: 1px solid rgba(218,60,51,.25); font-size: 14px; color: var(--ink); }
    .msg.on { display: block; }
    .msg a { border-bottom: 1px solid var(--ink-3); }
    .foot { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line-c); text-align: center; font-size: 14px; color: var(--ink-2); }
    .foot a { color: var(--ink); border-bottom: 1px solid var(--ink-3); }
  </style>
</head>
<body>
  <header>
    <a href="/en"><img src="/images/logo-koddo-ink.svg" alt="Koddo · built by agents, designed by humans"></a>
    <a class="back" href="/en">← Back</a>
  </header>

  <main>
    <section class="card" aria-labelledby="t">
      <span class="label"><span class="dot-red"></span>Access</span>
      <h1 id="t">Sign in to your <em>platform.</em></h1>
      <p class="sub">All your projects in one place: request, track and approve.</p>

      <!-- Fake door: the form sends no data; it always answers with wrong credentials and points to plans. -->
      <form id="entrar" novalidate>
        <label class="f" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
        <label class="f" for="clave">Password</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" placeholder="••••••••••" required>
        <button type="submit">Sign in</button>
        <p class="msg" id="msg" role="alert">Incorrect email or password. Don't have an account yet? <a href="/en#plans">See plans</a></p>
      </form>

      <p class="foot">Don't have an account yet? <a href="/en#plans">See plans</a></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('entrar');
    const btn = form.querySelector('button');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', e => {
      e.preventDefault();
      msg.classList.remove('on');
      btn.disabled = true;
      btn.textContent = 'Verifying…';
      setTimeout(() => {
        document.getElementById('clave').value = '';
        btn.disabled = false;
        btn.textContent = 'Sign in';
        msg.classList.add('on');
      }, 900);
    });
  </script>
</body>
</html>
